<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F4F5F8">
<title>Kadokoli</title>
<link rel="icon" href="icon-192.png">
<style>
/*@@FONTS@@*/
/* Kadokoli — colis & cadeaux. Palette tirée du logo : bleu nuit, or du ruban, vert sauge et framboise du paquet. */
:root{
  --bg:#F4F5F8; --surface:#FFFFFF; --ink:#1B2A47; --muted:#5F6A80; --line:#E1E5EC;
  --iris:#2E4A78; --iris-2:#5B77A6; --iris-soft:#E5EAF3;
  --emerald:#3D9A7E; --emerald-soft:#DFF1EA;
  --nectar:#C25A7E; --nectar-soft:#F7E4EB;
  --sky:#4E9682; --sky-soft:#E1F0EB;
  --pollen:#D9AE5F; --pollen-soft:#FAF0DC;
  --danger:#E5484D;
  --r-lg:26px; --r-md:18px; --r-sm:12px;
  --shadow:0 10px 30px -12px rgba(20,40,79,.25);
  --display:"Bricolage Grotesque",ui-rounded,system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
body{min-height:100vh;padding-bottom:calc(92px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--iris-2);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 18px 24px}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.01em}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.hello{font-size:.95rem;color:var(--muted)}
h1{font-size:2.05rem;font-weight:800;line-height:1.05}
.bird{width:46px;height:46px;flex:none;border-radius:13px;box-shadow:0 6px 16px -6px rgba(31,51,85,.5)}
.elogo{width:84px;height:84px;border-radius:22px;display:block;margin:0 auto 12px}
/* ---- résumé en tête d'onglet ---- */
.hero{border-radius:var(--r-lg);padding:20px 20px 18px;color:#fff;position:relative;overflow:hidden;margin-bottom:22px;box-shadow:var(--shadow)}
.hero.parcels{background:linear-gradient(45deg,#1F3355 0%,#2E4A78 50%,#4E8A78 100%)}
.hero.gifts{background:linear-gradient(135deg,#B04C72 0%,#D9AE5F 100%)}
.hero .big{font-family:var(--display);font-weight:800;font-size:2.7rem;line-height:1}
.hero p{margin:6px 0 0;opacity:.95}
.hero .pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.hero .pill{background:rgba(255,255,255,.22);border-radius:999px;padding:5px 11px;font-size:.85rem;font-weight:600}
.hero svg.deco{position:absolute;right:-18px;top:-10px;width:150px;opacity:.22}
/* ---- sections ---- */
.sec{margin:0 0 24px}
.sech{display:flex;align-items:baseline;justify-content:space-between;margin:0 4px 10px}
.sech h2{font-size:1.15rem;font-weight:700}
.sech span{color:var(--muted);font-size:.9rem}
.list{display:flex;flex-direction:column;gap:10px}
/* ---- colis ---- */
.pcard{display:block;width:100%;text-align:left;background:var(--surface);border:0;border-radius:var(--r-md);padding:14px 16px 12px;box-shadow:0 2px 0 var(--line)}
.pcard .row1{display:flex;align-items:center;gap:10px}
.carrier{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--iris-soft);color:var(--iris);white-space:nowrap}
.carrier i{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}
.pname{font-weight:700;font-size:1.05rem;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pstat{margin:6px 0 10px;font-size:.92rem;color:var(--muted)}
.pstat b{color:var(--ink);font-weight:600}
/* le trajet du colis : une ligne pointillée, le colibri vole jusqu'à l'étape en cours */
.journey{position:relative;height:30px;margin:0 6px}
.journey .track{position:absolute;left:0;right:0;top:15px;border-top:3px dotted var(--line)}
.journey .done{position:absolute;left:0;top:13.5px;height:6px;border-radius:6px;background:linear-gradient(90deg,var(--iris),var(--sky))}
.journey .dot{position:absolute;top:10px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:var(--surface);border:3px solid var(--line)}
.journey .dot.on{border-color:var(--iris);background:var(--iris)}
.journey .flyer{position:absolute;top:2px;width:28px;height:28px;margin-left:-14px;border-radius:9px;overflow:hidden;box-shadow:0 0 0 3px var(--surface),0 4px 10px -3px rgba(31,51,85,.55);transition:left .8s cubic-bezier(.3,1.4,.5,1)}
.journey .flyer img{width:100%;height:100%;display:block}
.journey .flyer.bad{box-shadow:0 0 0 3px var(--danger)}
.journey.big{height:44px;margin:12px 10px 4px}
.journey.big .track{top:22px}.journey.big .done{top:20.5px}.journey.big .dot{top:16px;width:18px;height:18px;margin-left:-9px}
.journey.big .flyer{top:4px;width:36px;height:36px;margin-left:-18px;border-radius:11px}
.jlabels{display:flex;justify-content:space-between;font-size:.72rem;color:var(--muted);margin:0 -4px 6px}
.jlabels span{width:20%;text-align:center}
.jlabels span.on{color:var(--ink);font-weight:700}
.pcard.delivered{opacity:.75}
.pcard.relay{box-shadow:0 0 0 2px var(--pollen) inset}
.code{font-family:var(--display);font-weight:700;letter-spacing:.06em}
.place{display:flex;gap:12px;background:var(--surface);border-radius:var(--r-md);padding:14px 16px;margin-bottom:12px}
.place.relay{background:var(--pollen-soft)}
.place .pic{font-size:1.5rem;line-height:1}.place .ptxt{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:3px}
.place .ptxt b{font-size:1.02rem;overflow-wrap:anywhere}.place .btn{margin-top:8px;padding:9px 14px}.place .btn.ghost{padding:6px 0}
.prelay{display:block;margin-top:2px;color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.relaybox{background:var(--pollen-soft);border-radius:var(--r-sm);padding:10px 12px;margin-top:10px;font-size:.92rem}
/* ---- cadeaux : de vraies cartes ---- */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 12px;margin:0 -2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:0;background:var(--surface);color:var(--muted);border-radius:999px;padding:8px 14px;font-weight:600;font-size:.9rem;white-space:nowrap;box-shadow:0 1px 0 var(--line)}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff}
.gcard{position:relative;display:block;width:100%;border:0;text-align:left;color:#fff;border-radius:22px;padding:16px 18px;aspect-ratio:1.75;overflow:hidden;box-shadow:var(--shadow)}
.gcard .brand{font-family:var(--display);font-weight:800;font-size:1.45rem;line-height:1.05;max-width:75%}
.gcard .kind{font-size:.82rem;opacity:.9;font-weight:600;margin-top:4px}
.gcard .amt{position:absolute;left:18px;bottom:16px}
.gcard .amt b{font-family:var(--display);font-weight:800;font-size:2rem;line-height:1;display:block}
.gcard .amt small{opacity:.9;font-size:.82rem}
.gcard .exp{position:absolute;right:14px;top:14px;background:rgba(255,255,255,.25);backdrop-filter:blur(4px);border-radius:999px;padding:4px 10px;font-size:.78rem;font-weight:700}
.gcard .exp.soon{background:var(--pollen);color:var(--ink)}
.gcard .exp.urgent{background:#fff;color:var(--danger)}
.gcard .exp.gone{background:rgba(0,0,0,.35)}
.gcard .meter{position:absolute;right:18px;bottom:20px;width:38%;height:6px;border-radius:6px;background:rgba(255,255,255,.3)}
.gcard .meter i{display:block;height:100%;border-radius:6px;background:#fff}
.gcard .chipdeco{position:absolute;right:18px;top:50%;width:44px;height:34px;border-radius:8px;background:linear-gradient(135deg,rgba(255,255,255,.55),rgba(255,255,255,.15));transform:translateY(-50%)}
.gcard.used{filter:saturate(.25);opacity:.75}
.ggrid{display:grid;grid-template-columns:1fr;gap:14px}
@media (min-width:560px){.ggrid{grid-template-columns:1fr 1fr}}
/* ---- vide ---- */
.empty{background:var(--surface);border-radius:var(--r-lg);padding:28px 22px;text-align:center}
.empty svg{width:110px;margin:0 auto 8px;display:block}
.empty h3{font-size:1.2rem;margin-bottom:6px}
.empty p{color:var(--muted);margin:0 0 16px}
/* ---- boutons ---- */
.btn{text-decoration:none;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:13px 20px;font-weight:700;background:var(--iris);color:#fff}
.btn.full{width:100%}
.btn.soft{background:var(--iris-soft);color:var(--iris)}
.btn.ghost{background:transparent;color:var(--iris);padding:10px 12px}
.btn.danger{background:var(--nectar-soft);color:#C21E58}
.btn.pink{background:var(--nectar)}
.btn.green{background:var(--emerald)}
.btn svg{width:18px;height:18px}
.btnrow{display:flex;gap:10px;flex-wrap:wrap}
.btnrow .btn{flex:1 1 140px}
/* ---- barre du bas + bouton ajouter ---- */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 14px calc(8px + env(safe-area-inset-bottom));display:flex;justify-content:center}
nav.tabs .in{display:flex;gap:6px;max-width:640px;width:100%;align-items:center}
nav.tabs button.tab{flex:1;border:0;background:transparent;border-radius:16px;padding:7px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.78rem;font-weight:600;color:var(--muted)}
nav.tabs button.tab svg{width:24px;height:24px}
nav.tabs button.tab[aria-current="page"]{color:var(--iris);background:var(--iris-soft)}
nav.tabs .add{width:58px;height:58px;border-radius:20px;border:0;background:linear-gradient(135deg,var(--nectar),var(--iris));color:#fff;display:grid;place-items:center;box-shadow:0 10px 24px -8px rgba(46,74,120,.55);margin:-26px 6px 0}
nav.tabs .add svg{width:28px;height:28px}
/* ---- feuilles (détail, ajout) ---- */
.scrim{position:fixed;inset:0;background:rgba(20,40,79,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s ease}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:28px 28px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));animation:up .28s cubic-bezier(.2,.9,.3,1.05)}
.grab{width:44px;height:5px;border-radius:5px;background:var(--line);margin:4px auto 12px}
.sheet h2{font-size:1.45rem;font-weight:800;margin-bottom:4px}
.sheet .sub{color:var(--muted);margin:0 0 16px}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.card{background:var(--surface);border-radius:var(--r-md);padding:14px 16px;margin-bottom:12px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:.95rem}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:600;text-align:right;overflow-wrap:anywhere}
.field{display:block;margin-bottom:12px}
.field>span{display:block;font-size:.88rem;font-weight:600;margin:0 0 6px 4px}
.field input,.field select,.field textarea{width:100%;border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;font-size:1rem}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--iris-2);outline:none}
.field textarea{min-height:76px;resize:vertical}
.field .hint{display:block;font-size:.82rem;color:var(--muted);margin:6px 4px 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.seg button{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 12px;font-weight:600;display:flex;align-items:center;gap:8px;flex:1 1 auto}
.seg button[aria-pressed="true"]{border-color:var(--iris);background:var(--iris-soft);color:var(--iris)}
.seg button span{font-size:1.2rem}
.detected{display:flex;align-items:center;gap:8px;background:var(--emerald-soft);color:#0A7A5B;border-radius:12px;padding:8px 12px;font-weight:600;font-size:.9rem;margin:-4px 0 12px}
.timeline{list-style:none;margin:0;padding:0}
.timeline li{position:relative;padding:0 0 14px 26px}
.timeline li::before{content:"";position:absolute;left:6px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--line)}
.timeline li::after{content:"";position:absolute;left:10px;top:18px;bottom:0;width:2px;background:var(--line)}
.timeline li:last-child::after{display:none}
.timeline li:first-child::before{background:var(--iris);box-shadow:0 0 0 4px var(--iris-soft)}
.timeline b{display:block;font-weight:600}
.timeline small{color:var(--muted)}
.codebox{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);border:2px dashed var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.codebox .code{font-size:1.25rem;overflow-wrap:anywhere}
.barcode{background:#fff;border-radius:14px;padding:10px;text-align:center;margin-bottom:10px}
.barcode svg{max-width:100%;height:auto}
.photo{width:100%;border-radius:16px;display:block;margin-bottom:10px}
.uses{list-style:none;margin:0;padding:0}
.uses li{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:.95rem}
.uses li:last-child{border:0}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:999px;font-weight:600;z-index:60;max-width:90vw;text-align:center;animation:up .25s ease}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.setrow:last-child{border:0}
.setrow p{margin:2px 0 0;color:var(--muted);font-size:.86rem}
.switch{appearance:none;width:50px;height:30px;border-radius:30px;background:var(--line);position:relative;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch:checked{background:var(--emerald)}.switch:checked::after{left:23px}
.upd{border-radius:var(--r-md);padding:16px;background:linear-gradient(135deg,var(--emerald-soft),var(--sky-soft));margin-bottom:12px}
.upd h3{font-size:1.1rem;margin-bottom:4px}
.upd p{margin:0 0 12px;color:#2E4D5A}
.qr{background:#fff;border-radius:16px;padding:12px;width:180px;margin:6px auto 12px}
.small{font-size:.85rem;color:var(--muted)}
.gsteps{list-style:none;margin:0 0 14px;padding:0;display:flex;flex-direction:column;gap:12px}
.gstep{display:flex;gap:12px;background:var(--surface);border-radius:var(--r-md);padding:14px}
.gstep>div{flex:1;min-width:0}.gstep p{margin:4px 0 10px;color:var(--muted);font-size:.92rem}
.gnum{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--iris);color:#fff;font-weight:800;font-family:var(--display)}
.gstep.done .gnum{background:var(--emerald)}
.demo{display:inline-block;font-family:var(--body);font-size:.7rem;font-weight:700;color:var(--muted);background:var(--bg);border-radius:999px;padding:1px 7px;vertical-align:2px}
.demo.on{background:rgba(255,255,255,.28);color:#fff;margin-left:4px}
.tip{background:var(--surface);border-radius:var(--r-md);padding:16px;margin:-6px 0 22px;box-shadow:0 0 0 2px var(--iris-soft) inset}
.tip p{margin:4px 0 12px;color:var(--muted);font-size:.92rem}
.steps{margin:8px 0 12px;padding-left:20px;font-size:.9rem;color:var(--ink)}.steps li{margin:3px 0}.steps a{color:var(--iris);font-weight:600}
.okpill{display:inline-block;background:var(--emerald-soft);color:#0A7A5B;border-radius:999px;padding:1px 8px;font-size:.75rem;font-weight:700;vertical-align:1px}
.cta-pill{display:inline-flex;gap:6px;align-items:center;background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:600;font-size:.88rem;border:0;color:var(--iris)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="wrap" id="app"></main>
<nav class="tabs" id="nav"></nav>
<div id="layer"></div>
<script>/*@@JSBARCODE@@*/</script>
<script id="app-js">
(function(){
'use strict';
var APP_BUILD=0; /* remplacé par le numéro de version au moment de construire l'APK */
var REPO='Nagromc86/kadokoli';
var APK_URL='https://github.com/'+REPO+'/releases/latest/download/kadokoli.apk';
var LOGO='/*@@LOGO@@*/';
function logo(cls){return '<img class="'+(cls||'logo')+'" src="'+LOGO+'" alt="">'}
var NATIVE=!!(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform());
var KEY='kadokoli:v1';

/* ---------- données ---------- */
var D=load();
function blank(){return {parcels:[],gifts:[],me:{name:'',notif:true,laposteKey:'',t123Key:''},seen:0}}
function load(){try{var d=JSON.parse(localStorage.getItem(KEY)||'null');if(d&&d.parcels)return Object.assign(blank(),d)}catch(e){}return blank()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){toast('Mémoire pleine : supprime des photos de cartes.')}scheduleReminders();pushWidgets()}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
var S={tab:'parcels',gfilter:'all',sheet:null,showDelivered:false,update:null};

/* ---------- utilitaires ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function $(s,r){return (r||document).querySelector(s)}
function money(n){var v=Math.round((+n||0)*100)/100;return v.toLocaleString('fr-FR',{minimumFractionDigits:v%1?2:0,maximumFractionDigits:2})+' €'}
function num(v){if(v==null||v==='')return null;var n=parseFloat(String(v).replace(/\s/g,'').replace(',','.'));return isFinite(n)?n:null}
function today(){var d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())}
function pdate(s){if(!s)return null;var p=String(s).slice(0,10).split('-');return p.length===3?new Date(+p[0],+p[1]-1,+p[2]):null}
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function daysTo(s){var d=pdate(s);return d?Math.round((d-today())/864e5):null}
var fLong=new Intl.DateTimeFormat('fr-FR',{weekday:'long',day:'numeric',month:'long'});
var fShort=new Intl.DateTimeFormat('fr-FR',{day:'numeric',month:'short',year:'numeric'});
var fDay=new Intl.DateTimeFormat('fr-FR',{day:'numeric',month:'long'});
var fTime=new Intl.DateTimeFormat('fr-FR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
function cap(s){return s?s.charAt(0).toUpperCase()+s.slice(1):s}
function toast(m){[].forEach.call(document.querySelectorAll('.toast'),function(x){x.remove()});var t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(function(){t.remove()},2600)}
function copy(t,label){
  var ok=function(){toast((label||'Copié')+' ✓')};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(ok,fb);else fb();
  function fb(){var a=document.createElement('textarea');a.value=t;a.style.cssText='position:fixed;opacity:0';document.body.appendChild(a);a.select();try{document.execCommand('copy');ok()}catch(e){}a.remove()}
}
function PL(n){return window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins[n]}
function share(title,text,url){
  if(NATIVE&&PL('Share'))return PL('Share').share({title:title,text:text,url:url,dialogTitle:'Partager'}).catch(function(){});
  if(navigator.share)return navigator.share({title:title,text:text,url:url}).catch(function(){});
  copy([text,url].filter(Boolean).join('\n'),'Texte copié, colle-le dans un message');
}
function hash(s){var h=0;s=String(s||'');for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return Math.abs(h)}

/* ---------- icônes ---------- */
var IC={

/* reconnaît le transporteur d'après le numéro (ou le lien collé) */
function detect(raw){
  var s=String(raw||'').trim(),host='',num=s;
  var m=/^https?:\/\/([^\/]+)(.*)$/i.exec(s);
  if(m){host=m[1].toLowerCase();var q=/[?&](?:code|numeroExpedition|tracknum|tracking-id|trknbr|listeNumerosLT|valeur|numColis|match|tracking)=([A-Za-z0-9]+)/.exec(m[2])||/\/([A-Za-z0-9]{8,})\/?$/.exec(m[2]);num=q?q[1]:''}
  num=num.replace(/[\s-]/g,'').toUpperCase();
  var byHost=[['laposte','colissimo'],['colissimo','colissimo'],['chronopost','chronopost'],['mondialrelay','mondialrelay'],['relaiscolis','relaiscolis'],['colisprive','colisprive'],['dpd','dpd'],['gls','gls'],['ups.com','ups'],['dhl','dhl'],['fedex','fedex'],['amazon','amazon'],['vinted','vinted']];
  for(var i=0;i<byHost.length;i++)if(host.indexOf(byHost[i][0])>=0)return {num:num,carrier:byHost[i][1]};
  var c='';
  if(/^1Z[0-9A-Z]{16}$/.test(num))c='ups';
  else if(/^TBA\d{9,}$/.test(num))c='amazon';
  else if(/^[0-9][A-Z][0-9]{11}$/.test(num)||/^[A-Z]{2}\d{9}FR$/.test(num))c='colissimo';
  else if(/^[A-Z]{2}\d{9}[A-Z]{2}$/.test(num))c='chronopost';
  else if(/^(JJD|JVGL)\d+/.test(num)||/^\d{10}$/.test(num))c='dhl';
  else if(/^\d{14}$/.test(num))c='dpd';
  else if(/^\d{12}$/.test(num)||/^\d{15}$/.test(num))c='fedex';
  else if(/^\d{8}$/.test(num))c='mondialrelay';
  else if(/^\d{11}$/.test(num))c='gls';
  else if(/^\d{16}$/.test(num))c='colisprive';
  return {num:num,carrier:c};
}
function carrierOf(p){var c=CARRIERS[p.carrier];if(c&&p.carrier!=='other')return c;
  return {n:p.carrierName||(p.carrier==='other'?'Autre':D.me.t123Key&&!p.updated?'Recherche…':'Transporteur ?'),c:'#5E6B86',url:''}}
function trackUrl(p){var c=carrierOf(p);return p.link||p.trackLink||(c.url?c.url+encodeURIComponent(p.num):'')}
function canAuto(p){return !p.demo&&!!(D.me.t123Key||(D.me.laposteKey&&CARRIERS[p.carrier]&&CARRIERS[p.carrier].lp))}

/* ---------- suivi automatique La Poste (Colissimo, La Poste, Chronopost) ---------- */
function lpMap(code){code=String(code||'');if(/^DI/.test(code))return 'delivered';if(/^(AG|RE1)/.test(code))return 'relay';if(/^MD/.test(code))return 'out';if(/^(ND|RE|RS)/.test(code))return 'issue';if(/^(ET|PB|DO|EP)/.test(code))return 'transit';if(/^PC/.test(code))return 'shipped';return ''}
function refreshParcel(p,quiet,force){
  if(D.me.laposteKey&&CARRIERS[p.carrier]&&CARRIERS[p.carrier].lp)return lpRefresh(p,quiet||!!D.me.t123Key).then(function(ok){return ok||!D.me.t123Key?ok:t123Refresh(p,quiet,force)});
  if(D.me.t123Key)return t123Refresh(p,quiet,force);
  return Promise.resolve(false);
}
function lpRefresh(p,quiet){
  var key=D.me.laposteKey;
  return fetch('https://api.laposte.fr/suivi/v2/idships/'+encodeURIComponent(p.num)+'?lang=fr_FR',{headers:{'X-Okapi-Key':key,'Accept':'application/json'}}).then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j}})}).then(function(x){
    var sh=x.j&&x.j.shipment;
    if(!x.ok||!sh){if(!quiet)toast(x.j&&x.j.returnMessage?x.j.returnMessage:'Numéro inconnu chez La Poste pour l\'instant.');return false}
    var ev=(sh.event||[]).map(function(e){return {label:e.label,date:e.date,code:e.code}});
    ev.sort(function(a,b){return (b.date||'').localeCompare(a.date||'')});
    if(ev.length){p.events=ev;var st=lpMap(ev[0].code);if(st)p.status=st}
    if(sh.estimDate)p.eta=String(sh.estimDate).slice(0,10);
    var rpt=sh.contextData&&sh.contextData.removalPoint;if(rpt&&rpt.name&&(!p.relay||p.relayAuto)){p.relay=rpt.name;p.relayAuto=1}
    if(sh.deliveryDate&&p.status!=='delivered'&&/^DI/.test(ev[0]&&ev[0].code))p.status='delivered';
    p.updated=Date.now();save();return true;
  }).catch(function(){if(!quiet)toast('Pas de réponse de La Poste : vérifie ta connexion et ta clé.');return false});
}
/* ---------- suivi automatique Track123 : le numéro suffit, le transporteur est détecté ---------- */
var T123='https://api.track123.com/gateway/open-api/tk/';
function t123(path,body){
  return fetch(T123+path,{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json','Track123-Api-Secret':D.me.t123Key},body:JSON.stringify(body)})
    .then(function(r){return r.json().catch(function(){throw new Error('Track123 ne répond pas correctement ('+r.status+').')})});
}
function t123Msg(j){var m=j&&(j.msg||j.message)||'';if(/secret|key|auth|token|签名|密钥/i.test(m)||/^A0(1|2)/.test(j&&j.code||''))return 'Clé Track123 refusée : vérifie-la dans Mon compte.';if(/quota|额度|余额/i.test(m))return 'Quota Track123 du mois épuisé : choisis le transporteur à la main en attendant.';return m&&!/[\u4e00-\u9fff]/.test(m)?'Track123 : '+m:'Track123 ne trouve pas ce numéro pour l\'instant.'}
function t123Leg(c){var lm=c&&c.lastMileInfo&&c.lastMileInfo.openApiWayBillInfo;return lm&&lm.trackingDetails&&lm.trackingDetails.length?lm:(c&&c.localLogisticsInfo)||{}}
function t123Carrier(code,name){var x=(' '+(code||'')+' '+(name||'')+' ').toLowerCase();
  var R=[[/colissimo/,'colissimo'],[/chronopost/,'chronopost'],[/mondial|inpost/,'mondialrelay'],[/relais.?colis/,'relaiscolis'],[/colis.?priv/,'colisprive'],[/la.?poste|france.?post/,'laposte'],[/\bdpd/,'dpd'],[/\bgls/,'gls'],[/\bups\b/,'ups'],[/\bdhl/,'dhl'],[/fedex|\btnt\b/,'fedex'],[/amazon/,'amazon'],[/vinted/,'vinted']];
  for(var i=0;i<R.length;i++)if(R[i][0].test(x))return R[i][1];return 'other'}
function t123Status(st,last){
